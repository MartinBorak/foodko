name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests, lint, release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode is the commit count (app/build.gradle.kts); a shallow clone would make it 1.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The real google-services.json is gitignored (it binds a clone to one Firebase project).
      # The Google services plugin only needs a well-formed file to generate resources from.
      - name: Use placeholder Firebase config
        run: cp .github/ci/google-services.json app/google-services.json

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Release build (R8 + resource shrinking)
        run: ./gradlew assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules-test/package-lock.json

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cache emulator jar
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('rules-test/package-lock.json') }}

      - run: npm ci --prefix rules-test

      - name: Rules tests
        run: scripts/rules-test.sh
